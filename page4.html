<script>
if(typeof CanvasRenderingContext2D!=='undefined'&&!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.max(0,Math.min(+r||0,Math.abs(w)/2,Math.abs(h)/2));this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()}}
(()=>{
'use strict';
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const showErr=m=>{const e=$('err');e.style.display='block';e.textContent='⚠️ خطأ: '+m};
addEventListener('error',ev=>showErr(ev.message));
let W,H,D;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
addEventListener('contextmenu',e=>e.preventDefault());
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const sh=(h,f)=>'rgb('+hexRGB(h).map(v=>Math.round(f>0?v+(255-v)*f:v*(1+f)))+')';

/* المدينة: طرقان كبار + أزقة ضيقة */
const N=57,T=56;
const map=new Uint8Array(N*N),hgt=new Uint8Array(N*N),pal=new Uint8Array(N*N);
const hash=(x,y)=>{let h=Math.imul(x+7,374761393)^Math.imul(y+13,668265263);h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0};
for(let y=0;y<N;y++)for(let x=0;x<N;x++){
 const rx=x%7,ry=y%7,bx=Math.floor(x/7),by=Math.floor(y/7);let t=0;
 if(rx<2||ry<2)t=1;else if((bx+by)%2===0){if(rx===4)t=2}else if(ry===4)t=2;
 map[y*N+x]=t;
 const g=hash(Math.floor(x/2),Math.floor(y/2));hgt[y*N+x]=40+g%85;pal[y*N+x]=(g>>>8)%5;
}
const BC=['#d9c7a5','#c9805f','#e8e0d0','#8fa6b8','#d2a679'];
const tileAt=(px,py)=>{const tx=Math.floor(px/T),ty=Math.floor(py/T);return(tx<0||ty<0||tx>=N||ty>=N)?0:map[ty*N+tx]};
const solid=(px,py)=>tileAt(px,py)===0;
const solidR=(x,y)=>solid(x-11,y-11)||solid(x+11,y-11)||solid(x-11,y+11)||solid(x+11,y+11);
const mm=document.createElement('canvas');mm.width=mm.height=N;
(()=>{const g=mm.getContext('2d');for(let y=0;y<N;y++)for(let x=0;x<N;x++){g.fillStyle=map[y*N+x]===1?'#9aa3b5':map[y*N+x]===2?'#6b7280':'#222a38';g.fillRect(x,y,1,1)}})();
/* المباني كمستطيلات + الديكور */
const bld=[],bid=new Int16Array(N*N).fill(-1);
function addB(x,y,w,h){
 const g=hash(x*3+1,y*5+2),id=bld.length;
 bld.push({x,y,w,h,ht:62+g%90,pal:(g>>>5)%5,kind:(g>>>11)%9,g});
 for(let j=0;j<h;j++)for(let i=0;i<w;i++)bid[(y+j)*N+x+i]=id;
}
for(let by=0;by<8;by++)for(let bx=0;bx<8;bx++){
 const ox=7*bx+2,oy=7*by+2;
 if((bx+by)%2===0){for(const cx of[ox,ox+3]){addB(cx,oy,2,3);addB(cx,oy+3,2,2)}}
 else{for(const cy of[oy,oy+3]){addB(ox,cy,3,2);addB(ox+3,cy,2,2)}}
}
const sideBld=(tx,ty,dx,dy)=>{const x=tx+dx,y=ty+dy;return x>=0&&y>=0&&x<N&&y<N&&map[y*N+x]===0};
const PC=['#c1272d','#2a6fdb','#f4f1ea','#2b2b2b','#e9c46a','#2a9d8f'],CC=['#d62828','#2a6fdb','#f4f1ea','#2b2b2b','#f4a261','#2a9d8f','#8e5ea2','#6a994e'];
const decor=[],parked=[],ptiles=new Map();
for(let ty=0;ty<N;ty++)for(let tx=0;tx<N;tx++){
 if(map[ty*N+tx]!==1)continue;
 const cx=(tx+.5)*T,cy=(ty+.5)*T;
 for(const[dx,dy]of[[-1,0],[1,0],[0,-1],[0,1]]){
  if(!sideBld(tx,ty,dx,dy))continue;
  const r=hash(tx*13+dx*5+9,ty*17+dy*7+4)%100;
  if(r<24)decor.push({t:'tree',x:cx+dx*(T/2-6),y:cy+dy*(T/2-6),s:5+r%4,palm:r%3===0});
  else if(r<31)decor.push({t:'lamp',x:cx+dx*(T/2-5),y:cy+dy*(T/2-5)});
  else if(r<37){
   const p={x:cx+dx*(T/2-19),y:cy+dy*(T/2-19),a:dx!==0?Math.PI/2:0,col:PC[r%6],len:36,wd:20};
   parked.push(p);const k=Math.floor(p.y/T)*N+Math.floor(p.x/T);if(!ptiles.has(k))ptiles.set(k,[]);ptiles.get(k).push(p);
  }
 }
}
/* مسار الدرك (BFS) */
const flow=new Int16Array(N*N);let flowT=0;
function calcFlow(){
 flow.fill(-1);const sx=Math.floor(P.x/T),sy=Math.floor(P.y/T);
 if(sx<0||sy<0||sx>=N||sy>=N)return;
 const q=[sy*N+sx];flow[q[0]]=0;
 for(let h=0;h<q.length;h++){
  const i=q[h],x=i%N,y=(i/N)|0;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
   const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=N||ny>=N)continue;
   const j=ny*N+nx;if(flow[j]>=0||map[j]===0)continue;flow[j]=flow[i]+1;q.push(j);
  }
 }
}
const los=(x1,y1,x2,y2)=>{const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/20);for(let i=1;i<n;i++)if(solid(x1+(x2-x1)*i/n,y1+(y2-y1)*i/n))return false;return true};
/* مرور وناس */
let civ=[],peds=[];
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const laneOK=(d,tx,ty)=>{const rx=tx%7,ry=ty%7;return d===0?ry===1:d===2?ry===0:d===1?rx===0:rx===1};
function civPick(c){
 const tx=Math.floor(c.tx/T),ty=Math.floor(c.ty/T),opts=[],all=[];
 for(let d=0;d<4;d++){
  const nx=tx+DIRS[d][0],ny=ty+DIRS[d][1];
  if(nx<0||ny<0||nx>=N||ny>=N||map[ny*N+nx]!==1)continue;
  all.push(d);if(d!==(c.d+2)%4&&laneOK(d,nx,ny))opts.push(d);
 }
 const pool=opts.length?opts:all;if(!pool.length)return;
 const d=pool[Math.floor(Math.random()*pool.length)];
 c.d=d;c.tx=(tx+DIRS[d][0]+.5)*T;c.ty=(ty+DIRS[d][1]+.5)*T;
}
function newCiv(){
 const p=randRoad(500,1000,P),tx=Math.floor(p.x/T),ty=Math.floor(p.y/T);
 for(let d=0;d<4;d++){
  if(!laneOK(d,tx,ty))continue;
  const nx=tx+DIRS[d][0],ny=ty+DIRS[d][1];
  if(nx<0||ny<0||nx>=N||ny>=N||map[ny*N+nx]!==1)continue;
  return{x:p.x,y:p.y,a:d*Math.PI/2,d,tx:(nx+.5)*T,ty:(ny+.5)*T,sp:0,v:105+Math.random()*50,col:CC[Math.floor(Math.random()*CC.length)],len:Math.random()<.2?44:36,wd:Math.random()<.2?22:20};
 }
 return null;
}
function stepCiv(c,dt){
 if(Math.hypot(c.tx-c.x,c.ty-c.y)<16)civPick(c);
 const want=Math.atan2(c.ty-c.y,c.tx-c.x),diff=((want-c.a+Math.PI*3)%(Math.PI*2))-Math.PI;
 c.a+=Math.max(-1,Math.min(1,diff*4))*3.2*dt;
 const ax=Math.cos(c.a),ay=Math.sin(c.a);
 const chk=o=>{const rx=o.x-c.x,ry=o.y-c.y,f=rx*ax+ry*ay,sd=Math.abs(-rx*ay+ry*ax);return f>0&&f<52&&sd<22};
 let block=chk(P);
 if(!block)for(const o of civ)if(o!==c&&chk(o)){block=true;break}
 if(!block)for(const o of cops)if(chk(o)){block=true;break}
 c.sp+=((block?0:c.v)-c.sp)*Math.min(1,dt*3);
 c.x+=ax*c.sp*dt;c.y+=ay*c.sp*dt;
 const px=P.x-c.x,py=P.y-c.y,d=Math.hypot(px,py);
 if(d<30&&d>0){
  const nx=px/d,ny=py/d,rel=(P.vx-ax*c.sp)*nx+(P.vy-ay*c.sp)*ny;
  P.x+=nx*(30-d)*.7;P.y+=ny*(30-d)*.7;
  if(rel<0){P.vx-=rel*nx*1.2;P.vy-=rel*ny*1.2;if(-rel>110){P.hp-=-rel*.03;shake=Math.max(shake,8);beep(100,.1,.06);vib(30);burst(P.x,P.y,'#ffcf6a',6)}}
  c.sp*=.5;
 }
}
const PCOL=['#e63946','#2a9d8f','#e9c46a','#457b9d','#f4a261','#8e5ea2','#f1f1f1','#6a994e'],PSK=['#e0ad86','#c68642','#8d5524','#f1c27d'],PHR=['#1b1b1b','#3b2a1a','#5a3a22'];
function newPed(){
 const p=randRoad(250,900,P),tx=Math.floor(p.x/T),ty=Math.floor(p.y/T),sd=[];
 for(const q of[[-1,0],[1,0],[0,-1],[0,1]])if(sideBld(tx,ty,q[0],q[1]))sd.push(q);
 if(!sd.length)return null;
 const[dx,dy]=sd[Math.floor(Math.random()*sd.length)],s=Math.random()<.5?-1:1,al=dx!==0?[0,1]:[1,0];
 return{x:(tx+.5)*T+dx*(T/2-5),y:(ty+.5)*T+dy*(T/2-5),sx:dx,sy:dy,ax:al[0]*s,ay:al[1]*s,sp:20+Math.random()*14,ph:Math.random()*6,col:PCOL[Math.floor(Math.random()*PCOL.length)],skin:PSK[Math.floor(Math.random()*PSK.length)],hair:PHR[Math.floor(Math.random()*PHR.length)]};
}
function stepPed(p,dt){
 const nx=p.x+p.ax*p.sp*dt,ny=p.y+p.ay*p.sp*dt,tx=Math.floor(nx/T),ty=Math.floor(ny/T);
 if(tx>=0&&ty>=0&&tx<N&&ty<N&&map[ty*N+tx]===1&&sideBld(tx,ty,p.sx,p.sy)){p.x=nx;p.y=ny}else{p.ax*=-1;p.ay*=-1}
 p.ph+=dt*p.sp*.4;
}
function stepTraffic(dt){
 while(civ.length<12){const c=newCiv();if(!c)break;civ.push(c)}
 for(let i=0;i<civ.length;i++){const c=civ[i];stepCiv(c,dt);if(Math.hypot(c.x-P.x,c.y-P.y)>1500){const n=newCiv();if(n)civ[i]=n}}
 while(peds.length<26){const p=newPed();if(!p)break;peds.push(p)}
 for(let i=0;i<peds.length;i++){const p=peds[i];stepPed(p,dt);if(Math.hypot(p.x-P.x,p.y-P.y)>1100){const n=newPed();if(n)peds[i]=n}}
}
function randRoad(minD,maxD,ref){
 for(let i=0;i<300;i++){
  const x=Math.floor(Math.random()*N),y=Math.floor(Math.random()*N);
  if(map[y*N+x]!==1)continue;
  const px=(x+.5)*T,py=(y+.5)*T,d=Math.hypot(px-ref.x,py-ref.y);
  if(d>=minD&&d<=maxD)return{x:px,y:py};
 }
 return{x:(21+.5)*T,y:(28+.5)*T};
}

/* السيارات */
const CARS=[
 {n:'الصغيرة',price:0,col:'#ffd166',top:360,acc:300,grip:5.5,hp:100},
 {n:'الكوبي الحمر',price:500,col:'#e63946',top:430,acc:360,grip:5,hp:100},
 {n:'كازا سبور',price:1100,col:'#39a9ff',top:500,acc:420,grip:4.6,hp:110},
 {n:'أطلس 4x4',price:1800,col:'#2e8b57',top:440,acc:380,grip:6.5,hp:190},
 {n:'البرق الذهبي',price:3000,col:'#f5c518',top:590,acc:500,grip:4.2,hp:130}
];

try{save={...save,...JSON.parse(localStorage.getItem('arabiDrift')||'{}')}}catch(e){}
if(!Array.isArray(save.own))save.own=[0];

if(!save.own.includes(0))save.own.unshift(0);

 {t:'سباق مع الوقت',d:'وصل للنقطة ف 45 ثانية',type:'reach',n:1,time:45,pol:0,r:200},
 {t:'الطرود الحارة',d:'جمع 5 طرود والدرك وراك',type:'collect',n:5,time:120,pol:2,r:350},
 {t:'المهمة الكبرى',d:'3 نقط متتابعين والدرك كيطاردك',type:'reach',n:3,time:130,pol:3,r:700}
];
if(!Number.isInteger(save.mi)||save.mi<0||save.mi>=MIS.length)save.mi=0;

/* الحالة */
let state='menu',P,cops=[],pk=[],tg=[],marks=[],parts=[],mst,mi=save.mi,cam={x:0,y:0},shake=0,bust=0,drift=0,time=0,last=0,hudT=0,toastT=0,muted=false;
const K={l:0,r:0,up:0,dn:0,hb:0,nt:0};
let ac=null,eng=null,engG=null;
function snd(){
 if(ac)return;
 try{ac=new(window.AudioContext||window.webkitAudioContext)();eng=ac.createOscillator();engG=ac.createGain();eng.type='sawtooth';eng.frequency.value=60;engG.gain.value=0;eng.connect(engG);engG.connect(ac.destination);eng.start()}catch(e){}
}
function beep(f=440,d=.08,v=.04){
 if(!ac||muted)return;
 try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}

/* الفيزياء */
function stepCar(c,dt){
 let imp=0;
 const nx=c.x+c.vx*dt;if(solidR(nx,c.y)){imp=Math.max(imp,Math.abs(c.vx));c.vx*=-.35;c.vy*=.85}else c.x=nx;
 const ny=c.y+c.vy*dt;if(solidR(c.x,ny)){imp=Math.max(imp,Math.abs(c.vy));c.vy*=-.35;c.vx*=.85}else c.y=ny;
 const tx=Math.floor(c.x/T),ty=Math.floor(c.y/T);
 for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
  const l=ptiles.get((ty+j)*N+tx+i);if(!l)continue;
  for(const p of l){
   const dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy);
   if(d<27&&d>0){
    const nx2=dx/d,ny2=dy/d;c.x+=nx2*(27-d);c.y+=ny2*(27-d);
    const vn=c.vx*nx2+c.vy*ny2;if(vn<0){imp=Math.max(imp,-vn);c.vx-=1.35*vn*nx2;c.vy-=1.35*vn*ny2}
   }
  }
 }
 return imp;
}
function burst(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,l:.5+Math.random()*.4,c:col})}
function drive(dt){
 const C=CARS[save.car],steer=(K.r?1:0)-(K.l?1:0),spd=Math.hypot(P.vx,P.vy);
 P.stw+=(steer-P.stw)*Math.min(1,dt*10);
 const nitro=!!K.nt&&P.nit>0&&!K.dn&&spd>40;
 P.nit=nitro?Math.max(0,P.nit-dt*.4):Math.min(1,P.nit+dt*.1);
 let fwd=P.vx*Math.cos(P.a)+P.vy*Math.sin(P.a);
 P.a+=steer*Math.min(1,spd/150)*(fwd<-5?-1:1)*(K.hb?3.1:2.2)*dt;
 const gx=Math.cos(P.a),gy=Math.sin(P.a);
 fwd=P.vx*gx+P.vy*gy;let lat=-P.vx*gy+P.vy*gx;
 if(K.up||nitro)fwd+=C.acc*(nitro?2.2:1)*dt;
 if(K.dn)fwd-=(fwd>0?C.acc*1.5:C.acc*.6)*dt;
 if(!K.up&&!K.dn)fwd*=Math.exp(-.8*dt);
 if(K.hb)fwd*=Math.exp(-.7*dt);
 fwd=Math.max(-C.top*.4,Math.min(C.top*(nitro?1.3:1),fwd));
 lat*=Math.exp(-(K.hb?.9:C.grip)*dt);
 P.vx=gx*fwd-gy*lat;P.vy=gy*fwd+gx*lat;
 if(nitro&&Math.random()<dt*70)parts.push({x:P.x-gx*20,y:P.y-gy*20,vx:-gx*80+(Math.random()-.5)*40,vy:-gy*80+(Math.random()-.5)*40,l:.3,c:Math.random()<.5?'#ffb347':'#ff5a1f'});
 const imp=stepCar(P,dt);
 if(imp>130){P.hp-=imp*.045;shake=Math.min(14,imp*.04);beep(110,.12,.06);vib(40);burst(P.x,P.y,'#ffcf6a',8)}
 if(Math.abs(lat)>85&&spd>140){
  drift+=spd*dt/28;
  if(marks.length>500)marks.splice(0,2);
  for(const s of [-1,1]){marks.push({x:P.x-gx*10-gy*s*7,y:P.y-gy*10+gx*s*7,l:6})}
  if(Math.random()<dt*20)parts.push({x:P.x-gx*12,y:P.y-gy*12,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,l:.6,c:'#d8d8d8'});
 }
 return spd;
}
function cop(dt,c){
 const dx=P.x-c.x,dy=P.y-c.y,d=Math.hypot(dx,dy),top=330+mi*18;
 let tx=P.x,ty=P.y;
 if(!(d<340&&los(c.x,c.y,P.x,P.y))){
  const cx=Math.floor(c.x/T),cy=Math.floor(c.y/T);
  let best=(cx>=0&&cy>=0&&cx<N&&cy<N&&flow[cy*N+cx]>=0)?flow[cy*N+cx]:1e9,bj=-1;
  for(const[ax,ay]of[[1,0],[-1,0],[0,1],[0,-1]]){
   const nx=cx+ax,ny=cy+ay;if(nx<0||ny<0||nx>=N||ny>=N)continue;
   const f=flow[ny*N+nx];if(f>=0&&f<best){best=f;bj=ny*N+nx}
  }
  if(bj>=0){tx=(bj%N+.5)*T;ty=((bj/N)|0)*T+T/2}
 }
 const want=Math.atan2(ty-c.y,tx-c.x);
 if(c.rev>0){c.rev-=dt;c.a+=c.dir*1.4*dt;c.sp=-110}
 else{
  const diff=((want-c.a+Math.PI*3)%(Math.PI*2))-Math.PI;
  c.a+=Math.max(-1,Math.min(1,diff*3))*3*dt;
  c.sp+=(top*(Math.abs(diff)>1.2?.5:1)-c.sp)*Math.min(1,dt*1.3);
 }
 c.vx=Math.cos(c.a)*c.sp;c.vy=Math.sin(c.a)*c.sp;
 const imp=stepCar(c,dt);
 if(imp>15){c.sp*=.5;c.stuck+=dt*2}else c.stuck=Math.max(0,c.stuck-dt);
 if(c.stuck>.9){c.rev=.7;c.stuck=0;c.dir=Math.random()<.5?-1:1}
 if(d<28){
  const nx=dx/(d||1),ny=dy/(d||1);
  P.vx+=nx*90;P.vy+=ny*90;c.sp*=.6;c.x-=nx*3;c.y-=ny*3;
  P.hp-=3;shake=Math.max(shake,8);beep(90,.1,.06);vib(30);
 }
 if(d>1400){const p=randRoad(650,950,P);c.x=p.x;c.y=p.y}
 return d;
}

/* المهمة */
function updateMission(dt){
 const m=MIS[mi];
 if(m.time>0){mst.t-=dt;if(mst.t<=0){fail('الوقت سالا');return}}
 if(m.type==='reach'){
  const t=tg[mst.idx];
  if(t&&Math.hypot(P.x-t.x,P.y-t.y)<46){mst.idx++;beep(1000,.15);toast('📍 وصلتي!');if(mst.idx>=m.n){complete();return}}
  mst.prog=mst.idx;
 }else if(m.type==='collect'){
  for(let i=pk.length-1;i>=0;i--)if(Math.hypot(P.x-pk[i].x,P.y-pk[i].y)<32){pk.splice(i,1);mst.prog++;beep(900,.1);burst(P.x,P.y,'#ffd166',10);toast('📦 '+mst.prog+'/'+m.n)}
  if(mst.prog>=m.n){complete();return}
 }else if(m.type==='drift'){
  mst.prog=Math.floor(drift);if(drift>=m.n){complete();return}
 }else{
  mst.prog+=dt;if(mst.prog>=m.n){complete();return}
 }
}

function update(dt){
 time+=dt;
 const spd=drive(dt);
 {const C0=CARS[save.car];if(P.hp<C0.hp*.4&&Math.random()<dt*20)parts.push({x:P.x+Math.cos(P.a)*14,y:P.y+Math.sin(P.a)*14,vx:(Math.random()-.5)*20,vy:-25,l:.7,c:P.hp<C0.hp*.2?'#ff9a3c':'#9a9a9a'})}
 while(cops.length<MIS[mi].pol){const p=randRoad(600,950,P);cops.push(newCar(null,p.x,p.y,Math.random()*6.28))}
 if(cops.length>MIS[mi].pol)cops.length=MIS[mi].pol;
 let near=false;
 flowT-=dt;if(flowT<=0){flowT=.25;calcFlow()}
 for(const c of cops){if(cop(dt,c)<70)near=true}
 stepTraffic(dt);
 bust=Math.max(0,Math.min(100,bust+dt*(near?(spd<150?32:9):-14)));
 if(P.hp<=0){fail('الطوموبيل تشرمل');return}
 if(bust>=100){fail('شدّوك الدرك');return}
 updateMission(dt);
 cam.x+=(P.x+P.vx*.3-cam.x)*Math.min(1,dt*4);cam.y+=(P.y+P.vy*.3-cam.y)*Math.min(1,dt*4);
 shake*=.88;
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}
 parts=parts.filter(p=>p.l>0);
 for(const m of marks)m.l-=dt*.4;
 marks=marks.filter(m=>m.l>0);
 if(engG&&!muted){eng.frequency.value=55+spd*.22;engG.gain.value=.016}
 hudT-=dt;
 if(hudT<=0){hudT=.1;hud()}
 if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on')}
}

/* الرسم */
function poly(a,b,c,d,f){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();ctx.fillStyle=f;ctx.fill()}
function drawGround(x0,y0,x1,y1){
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
  const t=map[ty*N+tx],sx=tx*T-cam.x+W/2,sy=ty*T-cam.y+H/2,g=hash(tx,ty);
  if(t===0){ctx.fillStyle='#8f949d';ctx.fillRect(sx,sy,T+1,T+1);continue}
  ctx.fillStyle=t===1?'#2e343e':'#433e3b';ctx.fillRect(sx,sy,T+1,T+1);
  if(t===2){
   ctx.fillStyle='rgba(255,255,255,.07)';
   for(let j=0;j<3;j++)for(let i=0;i<3;i++)if((g>>>(i+j*3))&1)ctx.fillRect(sx+i*18+3,sy+j*18+3,14,14);
   ctx.fillStyle='#8f949d';
   if(sideBld(tx,ty,-1,0))ctx.fillRect(sx,sy,4,T+1);
   if(sideBld(tx,ty,1,0))ctx.fillRect(sx+T-3,sy,4,T+1);
   if(sideBld(tx,ty,0,-1))ctx.fillRect(sx,sy,T+1,4);
   if(sideBld(tx,ty,0,1))ctx.fillRect(sx,sy+T-3,T+1,4);
   continue;
  }
  const rx=tx%7,ry=ty%7;
  if(g%6===0){ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(sx+8,sy+12,T-22,T-28)}
  if(g%13===0){ctx.fillStyle='#1c2026';ctx.beginPath();ctx.arc(sx+T/2,sy+T/2,6,0,7);ctx.fill();ctx.strokeStyle='#555c68';ctx.lineWidth=1;ctx.stroke()}
  ctx.fillStyle='#e8c547';
  if(ry>=2&&rx===1&&ty%2===0)ctx.fillRect(sx-1.5,sy+8,3,T*.5);
  if(rx>=2&&ry===1&&tx%2===0)ctx.fillRect(sx+8,sy-1.5,T*.5,3);
  ctx.fillStyle='rgba(245,245,245,.85)';
  if(rx<2&&(ry===2||ry===6))for(let i=0;i<7;i++)ctx.fillRect(sx+3+i*7.6,sy+12,4,T-24);
  if(ry<2&&(rx===2||rx===6))for(let i=0;i<7;i++)ctx.fillRect(sx+12,sy+3+i*7.6,T-24,4);
  for(const[dx,dy]of[[-1,0],[1,0],[0,-1],[0,1]]){
   if(!sideBld(tx,ty,dx,dy))continue;
   ctx.fillStyle='#b8bec8';
   if(dx===-1)ctx.fillRect(sx,sy,9,T+1);else if(dx===1)ctx.fillRect(sx+T-8,sy,9,T+1);
   else if(dy===-1)ctx.fillRect(sx,sy,T+1,9);else ctx.fillRect(sx,sy+T-8,T+1,9);
   ctx.fillStyle='#7f8693';
   if(dx===-1)ctx.fillRect(sx+9,sy,2,T+1);else if(dx===1)ctx.fillRect(sx+T-10,sy,2,T+1);
   else if(dy===-1)ctx.fillRect(sx,sy+9,T+1,2);else ctx.fillRect(sx,sy+T-10,T+1,2);
  }
 }
}
function drawMarks(){

}
function drawCar(c,col,isCop,me){
 const sx=c.x-cam.x+W/2,sy=c.y-cam.y+H/2,L=(c.len||36)/2,Wd=(c.wd||20)/2;
 if(sx<-60||sy<-60||sx>W+60||sy>H+60)return;
 ctx.save();ctx.translate(sx+4,sy+6);ctx.rotate(c.a);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.roundRect(-L,-Wd,2*L,2*Wd,6);ctx.fill();ctx.restore();
 ctx.save();ctx.translate(sx,sy);ctx.rotate(c.a);
 ctx.fillStyle='#0c0c0e';
 for(const[wx,wy]of[[-L*.6,-Wd-1],[L*.5,-Wd-1],[-L*.6,Wd-2.5],[L*.5,Wd-2.5]])ctx.fillRect(wx,wy,9,3.5);
 const g=ctx.createLinearGradient(0,-Wd,0,Wd);g.addColorStop(0,sh(col,.35));g.addColorStop(.5,col);g.addColorStop(1,sh(col,-.4));
 ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-L,-Wd,2*L,2*Wd,6);ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke();
 if(isCop){ctx.fillStyle='#1d4ed8';ctx.fillRect(-L,-2,2*L,4)}
 ctx.fillStyle='#ffe9a8';ctx.fillRect(L-2,-Wd+2,3,4);ctx.fillRect(L-2,Wd-6,3,4);
 ctx.fillStyle='#ff3b3b';ctx.fillRect(-L-1,-Wd+2,2.5,4);ctx.fillRect(-L-1,Wd-6,2.5,4);
 ctx.fillStyle=sh(col,-.3);ctx.fillRect(L*.25,-Wd-2,5,2.5);ctx.fillRect(L*.25,Wd-.5,5,2.5);
 ctx.restore();
 const ox=(sx-W/2)*.035,oy=(sy-H/2)*.035-4;
 ctx.save();ctx.translate(sx+ox,sy+oy);ctx.rotate(c.a);
 if(me){
  const w=(c.stw||0)*1.1,wx=L*.22,hx=-L*.1,hy=(c.stw||0)*1.4;
  ctx.fillStyle='#1a1d24';ctx.beginPath();ctx.roundRect(-L*.58,-Wd*.88,L*1.05,Wd*1.76,4);ctx.fill();
  ctx.fillStyle='#2b2f3a';ctx.beginPath();ctx.roundRect(-L*.52,-Wd*.72,L*.34,Wd*1.44,3);ctx.fill();
  ctx.fillStyle='#e9eef5';ctx.beginPath();ctx.ellipse(hx,0,4.6,Wd*.72,0,0,7);ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.arc(wx,0,5,0,7);ctx.stroke();
  ctx.lineWidth=1.4;ctx.beginPath();
  for(const a of[w+Math.PI/2,w-Math.PI/2,w+Math.PI]){ctx.moveTo(wx,0);ctx.lineTo(wx+Math.cos(a)*5,Math.sin(a)*5)}
  ctx.stroke();
  for(const sd of[-1,1]){
   const px=wx-sd*4.2*Math.sin(w),py=sd*4.2*Math.cos(w);
   ctx.strokeStyle='#e9eef5';ctx.lineWidth=3.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx,sd*Wd*.55);ctx.lineTo(px,py);ctx.stroke();
   ctx.fillStyle='#e0ad86';ctx.beginPath();ctx.arc(px,py,1.9,0,7);ctx.fill();
  }
  ctx.fillStyle='#e0ad86';ctx.beginPath();ctx.arc(hx+1,hy,4.3,0,7);ctx.fill();
  ctx.fillStyle='#20202a';ctx.beginPath();ctx.arc(hx,hy,4.6,Math.PI*.5,Math.PI*1.5);ctx.fill();
  ctx.fillStyle=col;ctx.fillRect(hx-.5,hy-4.4,2.4,8.8);
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(hx+3.6,hy-1.6,.7,0,7);ctx.arc(hx+3.6,hy+1.6,.7,0,7);ctx.fill();
 }else{
  ctx.fillStyle='#10202f';ctx.beginPath();ctx.roundRect(-L*.5,-Wd*.8,L*.95,Wd*1.6,4);ctx.fill();
  const g2=ctx.createLinearGradient(0,-Wd*.6,0,Wd*.6);g2.addColorStop(0,sh(col,.5));g2.addColorStop(1,sh(col,-.2));
  ctx.fillStyle=g2;ctx.beginPath();ctx.roundRect(-L*.35,-Wd*.6,L*.55,Wd*1.2,3);ctx.fill();
 }
 ctx.restore();
 if(isCop){
  const f=Math.floor(performance.now()/130)%2,lx=sx+ox,ly=sy+oy-3;
  ctx.fillStyle=f?'#ff2a4a':'#3b6bff';ctx.beginPath();ctx.arc(lx,ly,4,0,7);ctx.fill();
  const gl=ctx.createRadialGradient(lx,ly,0,lx,ly,34);gl.addColorStop(0,f?'rgba(255,40,70,.55)':'rgba(60,110,255,.55)');gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gl;ctx.fillRect(lx-34,ly-34,68,68);
 }
}
function box(gx,gy,gw,gh,k0,k1,col,cx,cy){
 const R=(x,y,kk)=>[cx+(x-cx)*(1+kk),cy+(y-cy)*(1+kk)],g=[[gx,gy],[gx+gw,gy],[gx+gw,gy+gh],[gx,gy+gh]];
 const B=g.map(p=>R(p[0],p[1],k0)),Tt=g.map(p=>R(p[0],p[1],k1));
 if(cx<B[0][0])poly(B[0],B[3],Tt[3],Tt[0],sh(col,-.25));
 if(cx>B[1][0])poly(B[1],B[2],Tt[2],Tt[1],sh(col,-.4));
 if(cy<B[0][1])poly(B[0],B[1],Tt[1],Tt[0],sh(col,-.1));
 if(cy>B[3][1])poly(B[3],B[2],Tt[2],Tt[3],sh(col,-.5));
 poly(Tt[0],Tt[1],Tt[2],Tt[3],col);
}
function face(p0,p1,r0,r1,n,sd,b,F,col){
 const P=(u,v)=>{const x0=p0[0]+(p1[0]-p0[0])*u,y0=p0[1]+(p1[1]-p0[1])*u,x1=r0[0]+(r1[0]-r0[0])*u,y1=r0[1]+(r1[1]-r0[1])*u;return[x0+(x1-x0)*v,y0+(y1-y0)*v]};
 const Q=(u0,u1,v0,v1,f)=>poly(P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1),f);
 Q(0,1,0,1,sh(col,sd));Q(0,1,.965,1,sh(col,sd+.3));
 const fh=1/F,cols=n*2;
 if(b.kind===1||b.kind===2){
  for(let i=0;i<n;i++){const u0=i/n+.07/n,u1=(i+1)/n-.07/n;Q(u0,u1,fh*.08,fh*.6,'#9fd8f5');Q(u0,u1,fh*.6,fh*.86,((i+b.g)%2)?'#d94f4f':'#f4f1ea')}
 }else{Q(.45,.55,0,fh*.7,'#2b6cb0');Q(.12,.3,fh*.2,fh*.6,'#2b4660');Q(.7,.88,fh*.2,fh*.6,'#2b4660')}
 for(let f=1;f<F;f++)for(let c=0;c<cols;c++){
  const u0=(c+.22)/cols,u1=(c+.78)/cols,v0=f*fh+fh*.25,v1=f*fh+fh*.78,lit=(b.g+f*3+c*5+n)%4===0;
  Q(u0,u1,v0,v1,lit?'#ffd98a':'#2b4660');Q(u0,u1,v0,v0+fh*.12,sh(col,sd-.2));
  if(f>=2&&c%2===0)Q(u0-.02,u1+.02,f*fh+fh*.1,f*fh+fh*.2,sh(col,sd-.35));
 }
}
function drawB(b,sx,sy,w,h,cx,cy){
 const k=b.ht/700,col=BC[b.pal],R=(x,y,kk)=>[cx+(x-cx)*(1+(kk===undefined?k:kk)),cy+(y-cy)*(1+(kk===undefined?k:kk))];
 const a=[sx,sy],bb=[sx+w,sy],c=[sx+w,sy+h],d=[sx,sy+h],ra=R(a[0],a[1]),rb=R(bb[0],bb[1]),rc=R(c[0],c[1]),rd=R(d[0],d[1]);
 const F=Math.max(2,Math.round(b.ht/30));
 if(cx<sx)face(a,d,ra,rd,b.h,-.28,b,F,col);
 if(cx>sx+w)face(bb,c,rb,rc,b.h,-.42,b,F,col);
 if(cy<sy)face(a,bb,ra,rb,b.w,-.12,b,F,col);
 if(cy>sy+h)face(d,c,rd,rc,b.w,-.5,b,F,col);
 poly(ra,rb,rc,rd,sh(col,.1));
 ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.stroke();
 const m=.1,I=(u,v)=>R(sx+w*u,sy+h*v);
 poly(I(m,m),I(1-m,m),I(1-m,1-m),I(m,1-m),sh(col,-.05));
 if(b.kind===0&&b.w*b.h>=6){
  const ap=R(sx+w/2,sy+h/2,k+.07);
  poly(ra,rb,ap,ap,sh('#1f9d55',-.15));poly(rb,rc,ap,ap,sh('#1f9d55',-.3));poly(rc,rd,ap,ap,sh('#1f9d55',-.45));poly(rd,ra,ap,ap,sh('#1f9d55',0));
  box(sx+w*.82,sy+h*.1,9,9,k,k+.12,'#efe6c8',cx,cy);
  const mt=R(sx+w*.82+4.5,sy+h*.1+4.5,k+.13);ctx.fillStyle='#1f9d55';ctx.beginPath();ctx.arc(mt[0],mt[1],5,0,7);ctx.fill();
 }else{
  const t=(b.g>>>3)%4;
  box(sx+w*.3,sy+h*.3,w*.25,h*.25,k,k+.03,sh(col,-.1),cx,cy);
  if(t!==1)box(sx+w*.68,sy+h*.62,9,7,k,k+.012,'#cfd6dd',cx,cy);
  if(t===1||t===3){const q=R(sx+w*.2,sy+h*.72,k+.025);ctx.fillStyle='#4a90c4';ctx.beginPath();ctx.arc(q[0],q[1],6,0,7);ctx.fill();ctx.strokeStyle='#1d4f78';ctx.stroke()}
  if(t===2){const q=R(sx+w*.75,sy+h*.25,k+.02);ctx.fillStyle='#eee';ctx.beginPath();ctx.arc(q[0],q[1],4.5,0,7);ctx.fill();ctx.strokeStyle='#888';ctx.stroke()}
 }
}
function drawBuildings(){
 const cx=W/2,cy=H/2,L=[];
 for(const b of bld){
  const sx=b.x*T-cam.x+cx,sy=b.y*T-cam.y+cy,w=b.w*T,h=b.h*T;
  if(sx>W+260||sy>H+260||sx+w<-260||sy+h<-260)continue;
  L.push([(sx+w/2-cx)**2+(sy+h/2-cy)**2,b,sx,sy,w,h]);
 }
 L.sort((a,c)=>c[0]-a[0]);
 for(const[,b,sx,sy,w,h]of L)drawB(b,sx,sy,w,h,cx,cy);
}
function drawPed(p){
 const sx=p.x-cam.x+W/2,sy=p.y-cam.y+H/2;
 if(sx<-20||sy<-20||sx>W+20||sy>H+20)return;
 const a=Math.atan2(p.ay,p.ax);
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(sx+1.5,sy+2,5,3.5,0,0,7);ctx.fill();
 ctx.save();ctx.translate(sx,sy-2);ctx.rotate(a);
 ctx.fillStyle=p.col;ctx.beginPath();ctx.ellipse(0,0,3.2,5.2,0,0,7);ctx.fill();
 ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(0,0,3,0,7);ctx.fill();
 ctx.fillStyle=p.hair;ctx.beginPath();ctx.arc(-.8,0,3,Math.PI*.6,Math.PI*1.4);ctx.fill();
 ctx.restore();
}
function drawDecor(){
 for(const d of decor){
  const sx=d.x-cam.x+W/2,sy=d.y-cam.y+H/2;
  if(sx<-40||sy<-40||sx>W+40||sy>H+40)continue;
  const ox=(sx-W/2)*.06,oy=(sy-H/2)*.06-8;
  if(d.t==='tree'){
   const r=d.s+6;
   ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(sx+3,sy+4,r*.8,r*.6,0,0,7);ctx.fill();
   ctx.fillStyle='#5b3a1e';ctx.beginPath();ctx.arc(sx,sy,2.5,0,7);ctx.fill();
   if(d.palm){for(let i=0;i<8;i++){const a=i*.785;ctx.strokeStyle=i%2?'#2e8b3d':'#3aa84a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(sx+ox,sy+oy);ctx.lineTo(sx+ox+Math.cos(a)*r*1.1,sy+oy+Math.sin(a)*r*1.1);ctx.stroke()}}
   else{const g=ctx.createRadialGradient(sx+ox-r*.3,sy+oy-r*.3,r*.1,sx+ox,sy+oy,r);g.addColorStop(0,'#5fcf72');g.addColorStop(.7,'#2e8b3d');g.addColorStop(1,'#1f6a2c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx+ox,sy+oy,r,0,7);ctx.fill()}
  }else{
   ctx.strokeStyle='#1c1f26';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+ox,sy+oy);ctx.stroke();
   ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(sx+ox,sy+oy,3,0,7);ctx.fill();
  }
 }
}
function glow(x,y,r,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,215,130,'+a+')');g.addColorStop(1,'rgba(255,215,130,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}
function beam(c,len,a){
 const sx=c.x-cam.x+W/2,sy=c.y-cam.y+H/2;
 if(sx<-len||sy<-len||sx>W+len||sy>H+len)return;
 ctx.save();ctx.translate(sx,sy);ctx.rotate(c.a);
 const g=ctx.createLinearGradient(16,0,len,0);g.addColorStop(0,'rgba(255,240,180,'+a+')');g.addColorStop(1,'rgba(255,240,180,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(16,-7);ctx.lineTo(len,-len*.34);ctx.lineTo(len,len*.34);ctx.lineTo(16,7);ctx.closePath();ctx.fill();ctx.restore();
}
function drawMarkers(){
 const f=performance.now()/1000;
 const m=MIS[mi];
 for(const p of pk){
  const sx=p.x-cam.x+W/2,sy=p.y-cam.y+H/2,bob=Math.sin(f*4)*3;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(sx,sy+6,12,6,0,0,7);ctx.fill();
  ctx.fillStyle='#e9a23b';ctx.fillRect(sx-9,sy-14+bob,18,16);ctx.fillStyle='#ffd166';ctx.fillRect(sx-9,sy-14+bob,18,5);
  ctx.strokeStyle='#8a5a12';ctx.strokeRect(sx-9,sy-14+bob,18,16);
 }
 if(m.type==='reach'){
  const t=tg[mst.idx];if(t){
   const sx=t.x-cam.x+W/2,sy=t.y-cam.y+H/2;
   const g=ctx.createLinearGradient(0,sy-260,0,sy);g.addColorStop(0,'rgba(255,230,90,0)');g.addColorStop(1,'rgba(255,230,90,.55)');
   ctx.fillStyle=g;ctx.fillRect(sx-22,sy-260,44,260);
   ctx.strokeStyle='#ffe45c';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(sx,sy,30+Math.sin(f*5)*3,18,0,0,7);ctx.stroke();
  }
 }
}
function target(){
 const m=MIS[mi];
 if(m.type==='reach')return tg[mst.idx];
 if(m.type==='collect'){let b=null,bd=1e9;for(const p of pk){const d=Math.hypot(p.x-P.x,p.y-P.y);if(d<bd){bd=d;b=p}}return b}
 return null;
}
function drawArrow(){
 const t=target();if(!t)return;
 const dx=t.x-P.x,dy=t.y-P.y,d=Math.hypot(dx,dy);if(d<260)return;
 const a=Math.atan2(dy,dx),r=Math.min(W,H)*.34;
 ctx.save();ctx.translate(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r);ctx.rotate(a);
 ctx.fillStyle='#ffe45c';ctx.strokeStyle='#000';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-11);ctx.lineTo(-4,0);ctx.lineTo(-10,11);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
 ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(Math.round(d/28)+' م',W/2+Math.cos(a)*(r+26),H/2+Math.sin(a)*(r+26)+4);
}
function drawMini(){
 const S=Math.min(120,W*.26),x=W-S-10,y=Math.max(70,H*.1);
 ctx.globalAlpha=.9;ctx.drawImage(mm,x,y,S,S);ctx.globalAlpha=1;ctx.strokeStyle='#ffffff55';ctx.strokeRect(x,y,S,S);
 const px=v=>v/(N*T)*S,dot=(p,c,r)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+px(p.x),y+px(p.y),r,0,7);ctx.fill()};
 for(const p of pk)dot(p,'#ffb347',2.5);
 const t=MIS[mi].type==='reach'?tg[mst.idx]:null;if(t)dot(t,'#ffe45c',4);
 const f=Math.floor(performance.now()/200)%2;
 for(const c of cops)dot(c,f?'#ff2a4a':'#3b6bff',3);
 dot(P,'#35f3ff',3.5);
}
function draw(){
 ctx.setTransform(D,0,0,D,0,0);
 ctx.fillStyle='#0b1220';ctx.fillRect(0,0,W,H);
 if(!P){return}
 ctx.save();
 if(shake>.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 const x0=Math.max(0,Math.floor((cam.x-W/2)/T)-1),x1=Math.min(N-1,Math.floor((cam.x+W/2)/T)+1);
 const y0=Math.max(0,Math.floor((cam.y-H/2)/T)-1),y1=Math.min(N-1,Math.floor((cam.y+H/2)/T)+1);
 drawGround(x0,y0,x1,y1);drawMarks();
 for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.l*1.5));ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x-cam.x+W/2,p.y-cam.y+H/2,3.5,0,7);ctx.fill()}
 ctx.globalAlpha=1;
 for(const p of peds)drawPed(p);
 for(const p of parked)drawCar(p,p.col,false);
 for(const c of civ)drawCar(c,c.col,false);
 for(const c of cops)drawCar(c,'#f4f6fa',true);
 drawCar(P,CARS[save.car].col,false,true);
 drawDecor();
 drawBuildings();
 drawMarkers();
 ctx.fillStyle='rgba(10,16,48,.3)';ctx.fillRect(-30,-30,W+60,H+60);
 ctx.globalCompositeOperation='lighter';
 beam(P,230,.42);for(const c of civ)beam(c,120,.2);for(const c of cops)beam(c,150,.22);
 for(const d of decor)if(d.t==='lamp'){const sx=d.x-cam.x+W/2,sy=d.y-cam.y+H/2;if(sx>-60&&sy>-60&&sx<W+60&&sy<H+60)glow(sx+(sx-W/2)*.06,sy+(sy-H/2)*.06-8,46,.55)}
 ctx.globalCompositeOperation='source-over';
 ctx.restore();
 const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,12,.45)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(P&&state==='play'&&P.hp<CARS[save.car].hp*.3){const q=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);q.addColorStop(0,'rgba(255,0,0,0)');q.addColorStop(1,'rgba(255,0,30,'+(.18+.12*Math.sin(performance.now()/150))+')');ctx.fillStyle=q;ctx.fillRect(0,0,W,H)}
 if(cops.length&&state==='play'){
  const f=Math.floor(performance.now()/180)%2,g=ctx.createLinearGradient(0,0,W,0),al=.06+bust/100*.22;
  g.addColorStop(f?0:1,'rgba(255,40,60,'+al+')');g.addColorStop(f?1:0,'rgba(60,110,255,'+al+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 }
 if(state==='play'||state==='pause'){drawArrow();drawMini()}
}
function frame(now){
 requestAnimationFrame(frame);
 try{
  const dt=Math.min(Math.max((now-last)/1000||0,0),.033);last=now;
  if(state==='play'&&P)update(dt);
  draw();
 }catch(e){showErr(e.message)}
}
show('menu');last=performance.now();requestAnimationFrame(frame);
})();
</script>
